<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9fc">
  <meta name="description" content="Un juego de deducción social para cuatro o más personas. Pasa el teléfono, da una pista y descubre al impostor.">
  <title>El Impostor · Juego de deducción social</title>
  <link rel="icon" href="./assets/mascara.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/fuentes/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./data.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <div class="brand"><img src="./assets/mascara.svg" alt="" width="40" height="40"><span>El Impostor</span></div>
      <button class="help-button" id="help" type="button">Cómo jugar</button>
    </div>
  </header>
  <main class="container" id="game" tabindex="-1"></main>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <canvas id="confetti" aria-hidden="true" hidden></canvas>
  <noscript>Activa JavaScript en tu navegador para jugar.</noscript>
</body>
</html>
